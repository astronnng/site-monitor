<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛰️ Painel de Monitoramento de Sites</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body data-check-interval="{{ check_interval }}">

<div id="loader"><div class="spinner"></div></div>

<header>
  <h1>🛰️ <span>Monitor</span> de Sites</h1>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
    <span id="last-updated">Aguardando dados…</span>
    <span id="refresh-badge">🔄 Atualiza a cada {{ check_interval }}s</span>
    <button id="theme-toggle" aria-label="Alternar tema" style="background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:1.05rem">🌙</button>
    <button id="add-site-btn" style="background:#0b1220;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer">➕ Adicionar site</button>
  </div>
</header>

<main>
  <!-- Resumo -->
  <div class="section-title">Visão geral</div>
  <div class="summary-grid">
    <div class="sum-card total">
      <span class="label">Total de sites</span>
      <span class="value" id="s-total">–</span>
    </div>
    <div class="sum-card up">
      <span class="label">🟢 Online</span>
      <span class="value" id="s-up">–</span>
    </div>
    <div class="sum-card down">
      <span class="label">🔴 Offline</span>
      <span class="value" id="s-down">–</span>
    </div>
    <div class="sum-card lat">
      <span class="label">Latência média</span>
      <span class="value" id="s-lat">–</span>
    </div>
  </div>

  <!-- Sites -->
  <div class="section-title">Sites</div>
  <div class="sites-grid" id="sites-grid">
    <!-- cards rendered by JS -->
  </div>
</main>

<!-- Modal de adicionar/editar site -->
<div id="site-modal" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:1000;">
  <div style="background:var(--surface);padding:18px;border-radius:10px;border:1px solid var(--border);width:420px;">
    <h3 id="modal-title" style="margin-bottom:8px">Adicionar site</h3>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <input id="site-name" placeholder="Nome do site" style="padding:8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text)" />
      <input id="site-url" placeholder="https://exemplo.com" style="padding:8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text)" />
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button id="modal-cancel" style="padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted)">Cancelar</button>
        <button id="modal-submit" style="padding:8px 12px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#07202c">Adicionar</button>
      </div>
      <div id="modal-feedback" style="color:var(--red);font-size:.9rem;display:none"></div>
    </div>
  </div>
</div>

<script src="/static/js/ui.js" defer></script>
</body>
</html>
