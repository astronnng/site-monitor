<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛰️ Painel de Monitoramento de Sites</title>
  <style>
    /* ── Reset e base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --green:    #3fb950;
      --red:      #f85149;
      --yellow:   #d29922;
      --blue:     #58a6ff;
      --purple:   #bc8cff;
      --card-r:   12px;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Cabeçalho ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: .5px; }
    header h1 span { color: var(--blue); }
    #last-updated { font-size: .8rem; color: var(--muted); }
    #refresh-badge {
      font-size: .75rem;
      background: #1f2937;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      color: var(--muted);
    }

    /* ── Layout principal ── */
    main { max-width: 1300px; margin: 0 auto; padding: 28px 24px 60px; }

    /* ── Cartões de resumo ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .sum-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-r);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sum-card .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
    .sum-card .value { font-size: 2rem; font-weight: 700; }
    .sum-card.up    .value { color: var(--green); }
    .sum-card.down  .value { color: var(--red); }
    .sum-card.lat   .value { color: var(--purple); }
    .sum-card.total .value { color: var(--blue); }

    /* ── Grade de sites ── */
    .sites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
    }
    .site-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-r);
      padding: 20px 22px;
      transition: transform .15s, box-shadow .15s;
      cursor: default;
    }
    .site-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px #0006; }
    .site-card.status-UP   { border-left: 4px solid var(--green); }
    .site-card.status-DOWN { border-left: 4px solid var(--red); }
    .site-card.status-PENDING { border-left: 4px solid var(--yellow); }

    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .site-name { font-weight: 600; font-size: 1rem; }
    .site-url  { font-size: .75rem; color: var(--muted); margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge {
      font-size: .72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: .5px;
    }
    .badge-UP      { background: #163a23; color: var(--green); border: 1px solid var(--green); }
    .badge-DOWN    { background: #3a1616; color: var(--red);   border: 1px solid var(--red); }
    .badge-PENDING { background: #3a2f00; color: var(--yellow);border: 1px solid var(--yellow); }

    .meta-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-item .mlabel { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .meta-item .mvalue { font-size: .9rem; font-weight: 600; }

    /* ── Mini sparkline ── */
    .sparkline-wrap { margin-top: 8px; }
    .sparkline-label { font-size: .68rem; color: var(--muted); margin-bottom: 4px; }
    .sparkline { display: flex; align-items: flex-end; gap: 3px; height: 36px; }
    .spark-bar {
      flex: 1;
      border-radius: 2px 2px 0 0;
      min-height: 4px;
      transition: height .3s;
    }
    .spark-bar.up   { background: var(--green); opacity: .85; }
    .spark-bar.down { background: var(--red);   opacity: .85; }

    /* ── Overlay de carregamento ── */
    #loader {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity .4s;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    .spinner {
      width: 46px; height: 46px;
      border: 4px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Título da seção ── */
    .section-title {
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Ponto pulsante ── */
    .pulse-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .pulse-dot.up {
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(63,185,80,.4);
      animation: pulse 1.8s infinite;
    }
    .pulse-dot.down { background: var(--red); }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(63,185,80,.5); }
      70%  { box-shadow: 0 0 0 8px rgba(63,185,80,0); }
      100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); }
    }

    /* ── Responsivo ── */
    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      main   { padding: 18px 12px 40px; }
      .sites-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-check-interval="{{ check_interval }}">

<div id="loader"><div class="spinner"></div></div>

<header>
  <h1>🛰️ <span>Monitor</span> de Sites</h1>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
    <span id="last-updated">Aguardando dados…</span>
    <span id="refresh-badge">🔄 Atualiza a cada {{ check_interval }}s</span>
    <button id="add-site-btn" style="background:#0b1220;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer">➕ Adicionar site</button>
  </div>
</header>

<main>
  <!-- Resumo -->
  <div class="section-title">Visão geral</div>
  <div class="summary-grid">
    <div class="sum-card total">
      <span class="label">Total de sites</span>
      <span class="value" id="s-total">–</span>
    </div>
    <div class="sum-card up">
      <span class="label">🟢 Online</span>
      <span class="value" id="s-up">–</span>
    </div>
    <div class="sum-card down">
      <span class="label">🔴 Offline</span>
      <span class="value" id="s-down">–</span>
    </div>
    <div class="sum-card lat">
      <span class="label">Latência média</span>
      <span class="value" id="s-lat">–</span>
    </div>
  </div>

  <!-- Sites -->
  <div class="section-title">Sites</div>
  <div class="sites-grid" id="sites-grid">
    <!-- cards rendered by JS -->
  </div>
</main>

<!-- Modal de adicionar/editar site -->
<div id="site-modal" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:1000;">
  <div style="background:var(--surface);padding:18px;border-radius:10px;border:1px solid var(--border);width:420px;">
    <h3 id="modal-title" style="margin-bottom:8px">Adicionar site</h3>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <input id="site-name" placeholder="Nome do site" style="padding:8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text)" />
      <input id="site-url" placeholder="https://exemplo.com" style="padding:8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text)" />
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button id="modal-cancel" style="padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted)">Cancelar</button>
        <button id="modal-submit" style="padding:8px 12px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#07202c">Adicionar</button>
      </div>
      <div id="modal-feedback" style="color:var(--red);font-size:.9rem;display:none"></div>
    </div>
  </div>
</div>

<script>
  const REFRESH_MS = Number(document.body.dataset.checkInterval) * 1000;
  const historyCache = {};

  function fmt(ms) {
    if (ms == null) return '–';
    if (ms < 1000) return ms + ' ms';
    return (ms/1000).toFixed(1) + ' s';
  }

  function timeAgo(iso) {
    const diff = Math.round((Date.now() - new Date(iso)) / 1000);
    if (diff < 5)  return 'agora mesmo';
    if (diff < 60) return 'há ' + diff + 's';
    return 'há ' + Math.round(diff/60) + 'm';
  }

  function latColor(ms) {
    if (ms == null) return 'var(--muted)';
    if (ms < 300)  return 'var(--green)';
    if (ms < 800)  return 'var(--yellow)';
    return 'var(--red)';
  }

  function buildSparkline(hist) {
    if (!hist || hist.length === 0) return '<span style="color:var(--muted);font-size:.7rem">Sem histórico</span>';
    const maxLat = Math.max(...hist.map(h => h.latency_ms || 0), 1);
    return hist.map(h => {
      const pct = h.latency_ms ? Math.max(10, Math.round((h.latency_ms / maxLat) * 100)) : 10;
      const cls = h.status === 'UP' ? 'up' : 'down';
      return `<div class="spark-bar ${cls}" style="height:${pct}%" title="${h.status} | ${fmt(h.latency_ms)}"></div>`;
    }).join('');
  }

  function renderCard(site, hist) {
    const st    = site.status || 'PENDING';
    const dotCls = st === 'UP' ? 'up' : 'down';
    const code   = site.status_code ? `<span style="color:var(--muted);font-size:.8rem">(${site.status_code})</span>` : '';
    const errLine = site.error ? `<div style="color:var(--red);font-size:.75rem;margin-top:4px">⚠ ${site.error}</div>` : '';
    const checkedAt = site.checked_at ? timeAgo(site.checked_at) : 'pendente…';
    const spark = buildSparkline(hist);

    return `
      <div class="site-card status-${st}" id="card-${site.name.replace(/\s/g,'_')}">
        <div class="card-header">
          <span style="display:flex;align-items:center;gap:12px">
            <span class="site-name"><span class="pulse-dot ${dotCls}"></span>${site.name}</span>
            <button onclick="openEditModal('${site.name.replace(/'/g,"\\'")}')" style="background:transparent;border:0;color:var(--muted);cursor:pointer">✏️</button>
            <button onclick="deleteSite('${site.name.replace(/'/g,"\\'")}')" style="background:transparent;border:0;color:var(--muted);cursor:pointer">🗑️</button>
          </span>
          <span class="badge badge-${st}">${st}</span>
        </div>
        <div class="site-url">${site.url}</div>
        <div class="meta-row">
          <div class="meta-item">
            <span class="mlabel">Latência</span>
            <span class="mvalue" style="color:${latColor(site.latency_ms)}">${fmt(site.latency_ms)}</span>
          </div>
          <div class="meta-item">
            <span class="mlabel">HTTP</span>
            <span class="mvalue">${site.status_code ?? '–'}</span>
          </div>
          <div class="meta-item">
            <span class="mlabel">Última verificação</span>
            <span class="mvalue" style="color:var(--muted)">${checkedAt}</span>
          </div>
        </div>
        ${errLine}
        <div class="sparkline-wrap">
          <div class="sparkline-label">Últimas ${hist ? hist.length : 0} verificações</div>
          <div class="sparkline">${spark}</div>
        </div>
      </div>`;
  }

  async function fetchHistory(siteName) {
    try {
      const r = await fetch(`/api/history/${encodeURIComponent(siteName)}`);
      const d = await r.json();
      historyCache[siteName] = d.history || [];
    } catch (_) {}
  }

  // Modal / CRUD functions
  function showModal(title, submitLabel, name = '', url = '', onSubmit=null) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('site-name').value = name;
    document.getElementById('site-url').value = url;
    document.getElementById('modal-submit').textContent = submitLabel;
    document.getElementById('modal-feedback').style.display = 'none';
    document.getElementById('site-modal').style.display = 'flex';
    const submit = async () => {
      const n = document.getElementById('site-name').value.trim();
      const u = document.getElementById('site-url').value.trim();
      if (!n || !u) {
        const fb = document.getElementById('modal-feedback'); fb.textContent = 'Nome e URL são obrigatórios'; fb.style.display = 'block'; return;
      }
      try {
        await onSubmit(n,u);
        document.getElementById('site-modal').style.display = 'none';
        refresh();
      } catch (err) {
        const fb = document.getElementById('modal-feedback'); fb.textContent = err.message || 'Erro'; fb.style.display = 'block';
      }
    };
    document.getElementById('modal-submit').onclick = submit;
    document.getElementById('modal-cancel').onclick = () => { document.getElementById('site-modal').style.display = 'none'; };
  }

  async function openAddModal(){
    showModal('Adicionar site','Adicionar','', '', async (n,u)=>{
      const r = await fetch('/api/sites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,url:u})});
      if (!r.ok) throw new Error((await r.json()).error || 'Erro');
    });
  }

  async function openEditModal(name){
    // fetch existing url
    const card = document.getElementById('card-'+name.replace(/\s/g,'_'));
    const url = card ? card.querySelector('.site-url').textContent.trim() : '';
    showModal('Editar site','Salvar', name, url, async (n,u)=>{
      const r = await fetch('/api/sites/'+encodeURIComponent(name),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,url:u})});
      if (!r.ok) throw new Error((await r.json()).error || 'Erro');
    });
  }

  async function deleteSite(name){
    if (!confirm('Remover site "'+name+'"?')) return;
    const r = await fetch('/api/sites/'+encodeURIComponent(name),{method:'DELETE'});
    if (!r.ok) { alert((await r.json()).error || 'Erro'); return; }
    refresh();
  }

  async function refresh() {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();

      // summary
      document.getElementById('s-total').textContent = d.summary.total;
      document.getElementById('s-up').textContent    = d.summary.up;
      document.getElementById('s-down').textContent  = d.summary.down;
      document.getElementById('s-lat').textContent   = d.summary.avg_latency_ms != null
        ? d.summary.avg_latency_ms + ' ms' : '–';

      const ts = new Date(d.generated_at);
      document.getElementById('last-updated').textContent =
        'Última atualização: ' + ts.toLocaleTimeString();

      // fetch histories in parallel
      await Promise.all(d.sites.map(s => fetchHistory(s.name)));

      // render cards
      const grid = document.getElementById('sites-grid');
      grid.innerHTML = d.sites.map(s => renderCard(s, historyCache[s.name] || [])).join('');

      // hide loader
      document.getElementById('loader').classList.add('hide');
    } catch (e) {
      console.error('Erro ao atualizar:', e);
    }
  }

  // initial + interval
  // attach UI handlers
  document.getElementById('add-site-btn').addEventListener('click', openAddModal);

  // initial + interval
  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
