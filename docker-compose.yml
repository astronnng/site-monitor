services:
  site-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-monitor
    restart: unless-stopped
    ports:
      - "5000:5000"          # Acesse em http://localhost:5000
    environment:
      - CHECK_INTERVAL=30    # Com que frequência (segundos) verificar todos os sites
      - REQUEST_TIMEOUT=10   # Timeout HTTP por requisição (segundos)
      - MAX_CHECK_WORKERS=8  # Quantas checagens podem rodar em paralelo por ciclo
      - HISTORY_LIMIT=50     # Quantos pontos de histórico manter por site
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./templates
          target: /app/templates
        - action: sync
          path: ./static
          target: /app/static
        - action: sync
          path: ./package.json
          target: /app/package.json
        - action: sync
          path: ./tailwind.config.js
          target: /app/tailwind.config.js
        - action: sync
          path: ./postcss.config.js
          target: /app/postcss.config.js
    # Opcional: limites de recursos
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: 256M
